
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Perfiles</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <h1>Gestor de Perfiles</h1>

        <div class="perfiles">

            <!-- Perfil 1 -->
            <div id="perfil-1" class="card">

                <img 
                    id="foto-usuario-1"
                    src="perfil-1.jpg"
                    alt="Foto del primer usuario"
                >

                <h2 id="nombre-usuario-1">Juan Pérez</h2>

                <p id="bio-usuario-1">
                    Desarrollador Web Junior.
                </p>

                <div id="estado-cuenta-1">
                    Estado: Activo
                </div>

                <button id="btn-perfil-1" type="button">
                    Ver perfil
                </button>

            </div>

            <!-- Perfil 2 -->
            <div id="perfil-2" class="card">

                <img 
                    id="foto-usuario-2"
                    src="perfil-2.jpg"
                    alt="Foto del segundo usuario"
                >

                <h2 id="nombre-usuario-2">María López</h2>

                <p id="bio-usuario-2">
                    Diseñadora Gráfica.
                </p>

                <div id="estado-cuenta-2">
                    Estado: Activo
                </div>

                <button id="btn-perfil-2" type="button">
                    Ver perfil
                </button>

            </div>

        </div>

    </main>

    <script src="app.js"></script>

</body>
</html>
